[project]
name = "model-to-production"
version = "0.1.0"
description = "Reproducible ML delivery: pipeline, evaluation, API serving, traces, and monitoring"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "joblib>=1.4.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.5.0",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
    "httpx2>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/model_to_production"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"
